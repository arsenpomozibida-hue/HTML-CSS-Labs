<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Варіант 21 (Wi-Fi маршрутизатор)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="router-card">
        <!-- Зображення (квадратне, вирівняне по центру) -->
        <div class="image-container">
            <img src="img/router.jpg" alt="Wi-Fi маршрутизатор">
        </div>

        <!-- Властивості компоненти -->
        <div class="properties">
            <p class="router-title"><b>TP-Link Archer AX50</b></p>
            <p>Стандарт: <b>Wi-Fi 6 (802.11ax)</b></p>
            <p>Два діапазони: <b>Так</b></p>
            <p>LAN інтерфейси: <b>4x 1 Гбіт/с</b></p>
            <p>WAN інтерфейси: <b>1x 1 Гбіт/с</b></p>
            <p>Швидкість Wi-Fi: <b>2400 Мбіт/с</b></p>
        </div>

        <!-- Кнопки керування -->
        <div class="buttons-container">
            <button class="btn btn-edit">Edit</button>
            <button class="btn btn-delete">Delete</button>
        </div>
    </div>

</body>
</html>
